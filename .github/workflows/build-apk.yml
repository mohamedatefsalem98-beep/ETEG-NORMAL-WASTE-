name: Build ETEG Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Project using Capacitor
        run: |
          mkdir www
          cp index.html www/index.html

          # تهيئة المشروع وتثبيت Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # إعداد بيانات تطبيق ETEG Waste
          npx cap init "ETEG Waste" "com.eteg.wastecalculator" --web-dir www
          npx cap add android

          # استخراج أيقونة مصنع ETEG من ملف HTML وتطبيقها على الأندرويد
          grep -o 'rel="apple-touch-icon" href="data:image/png;base64,[^"]*"' index.html | sed 's/rel="apple-touch-icon" href="data:image\/png;base64,//;s/"//' | base64 -d > icon.png || true
          if [ -s icon.png ]; then
            find android/app/src/main/res -name "ic_launcher*.png" -exec cp icon.png {} \;
          fi

          # تفعيل دعم RTL والطباعة في WebView
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: ETEG-Waste-Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
