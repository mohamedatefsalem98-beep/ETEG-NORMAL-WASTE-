name: Build ETEG Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android Project
        run: |
          mkdir -p www

          # 1. العثور على ملف الـ HTML ونسخه
          HTML_FILE=$(find . -maxdepth 2 -iname "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: لم يتم العثور على ملف HTML!"
            exit 1
          fi
          cp "$HTML_FILE" www/index.html

          # 2. حقن إعدادات منع السكرول الجانبي (Viewport Fix) وتعديل ملف CSS ليتناسب مع كافة الشاشات
          python3 -c '
          with open("www/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          # التأكد من وجود وسم الـ viewport الصحيح الذي يمنع التمدد الخارجي
          if "name=\"viewport\"" in html:
              html = html.replace("<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">", "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">")
          else:
              html = html.replace("<head>", "<head>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">")

          # حقن قواعد CSS إضافية لمنع أي تجاوز أفقي (Overflow-x hidden) وتثبيت المحاذاة
          responsive_css = """
          <style>
            html, body {
              max-width: 100vw !important;
              overflow-x: hidden !important;
              box-sizing: border-box !important;
              -webkit-text-size-adjust: 100%;
            }
            * {
              max-width: 100%;
              box-sizing: border-box;
            }
            main {
              width: 100% !important;
              max-width: 1200px !important;
              margin: 0 auto !important;
              padding: 10px !important;
            }
            .card {
              width: 100% !important;
              max-width: 100% !important;
              overflow-x: hidden !important;
            }
            .tw {
              width: 100% !important;
              overflow-x: auto !important; /* الجدول وحده يتحرك أفقياً داخلياً لسهولة القراءة دون إخراج الشاشة */
            }
          </style>
          """
          html = html.replace("</head>", responsive_css + "\n</head>")

          with open("www/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          '

          # 3. تجهيز صورة اللوجو للشاشة الافتتاحية
          LOGO_FILE=$(find . -maxdepth 2 -iname "*logo*.png" -o -iname "*logo*.jpg" | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            B64_LOGO=$(base64 -w 0 "$LOGO_FILE")
            LOGO_SRC="data:image/png;base64,$B64_LOGO"
          else
            LOGO_SRC=$(grep -o 'data:image/png;base64,[^"]*' www/index.html | tail -n 1)
          fi

          # 4. بناء الشاشة الافتتاحية (Splash Screen) متناسبة مع الشاشات
          cat << EOF > splash_inject.html
          <style>
          #eteg-splash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
          }
          #eteg-splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
          }
          #eteg-splash img {
            width: 85%;
            max-width: 320px;
            height: auto;
            object-fit: contain;
            animation: splashZoom 0.9s ease-out;
          }
          #eteg-splash .powered {
            margin-top: 24px;
            font-family: 'Cairo', 'Segoe UI', Arial, sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #0b6e8a;
            letter-spacing: 0.5px;
            direction: ltr;
            text-align: center;
            animation: splashFade 1.2s ease-out;
          }
          @keyframes splashZoom {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
          }
          @keyframes splashFade {
            0%, 30% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
          }
          </style>
          <div id="eteg-splash">
            <img src="$LOGO_SRC" alt="ETEG Logo">
            <div class="powered">Powered By - Eng.Mohamed Atef</div>
          </div>
          <script>
          window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
              var s = document.getElementById('eteg-splash');
              if (s) {
                s.classList.add('hide');
                setTimeout(function() { s.remove(); }, 650);
              }
            }, 2500);
          });
          </script>
          EOF

          python3 -c '
          with open("www/index.html", "r", encoding="utf-8") as f:
              html = f.read()
          with open("splash_inject.html", "r", encoding="utf-8") as f:
              splash = f.read()
          html = html.replace("<body>", "<body>\n" + splash, 1)
          with open("www/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          '

          # 5. تضمين مكتبة الإكسيل داخل التطبيق
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o www/xlsx.full.min.js
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js|xlsx.full.min.js|g' www/index.html

          # 6. تحديث الاسم والإعدادات في Capacitor
          cat << 'EOF' > package.json
          {
            "name": "eteg-normal-waste-calculator",
            "version": "1.2.0",
            "private": true
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.eteg.wastecalculator",
            "appName": "ETEG Normal Waste Calculator",
            "webDir": "www"
          }
          EOF

          # 7. تثبيت الحزم وبناء المشروع
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

          # 8. ضبط الأيقونات وخلفية البدء
          if [ -n "$LOGO_FILE" ]; then
            cp "$LOGO_FILE" icon.png
          else
            grep -o 'data:image/png;base64,[^"]*' www/index.html | head -n 1 | sed 's/data:image\/png;base64,//' | base64 -d > icon.png || true
          fi
          if [ -s icon.png ]; then
            for f in $(find android/app/src/main/res/mipmap-* -name "ic_launcher.png" -o -name "ic_launcher_round.png" -o -name "ic_launcher_foreground.png"); do
              cp icon.png "$f"
            done
          fi

          sed -i 's/#[0-9a-fA-F]\{6\}/#FFFFFF/g' android/app/src/main/res/values/ic_launcher_background.xml || true

          # 9. تجميع ملف الـ APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: ETEG-Normal-Waste-Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
