name: Build ETEG Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Project
        run: |
          mkdir -p www

          # العثور التلقائي على أي ملف HTML في المستودع مهما كان اسمه ونسخه كـ index.html
          HTML_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "خطأ: لم يتم العثور على أي ملف HTML في المستودع! يرجى رفع الملف أولاً."
            exit 1
          fi
          cp "$HTML_FILE" www/index.html

          # تحميل مكتبة الإكسيل داخل التطبيق ليعمل بدون إنترنت
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o www/xlsx.full.min.js
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js|xlsx.full.min.js|g' www/index.html

          # تهيئة المشروع وتثبيت Capacitor (إصدار مستقر متوافق مع Java 21)
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          npx cap init "ETEG Waste" "com.eteg.wastecalculator" --web-dir www
          npx cap add android

          # استخراج أيقونة مصنع ETEG بأمان دون كسر ملفات 9-patch
          grep -o 'data:image/png;base64,[^"]*' www/index.html | head -n 1 | sed 's/data:image\/png;base64,//' | base64 -d > icon.png || true
          if [ -s icon.png ]; then
            for f in $(find android/app/src/main/res/mipmap-* -name "ic_launcher.png" -o -name "ic_launcher_round.png" -o -name "ic_launcher_foreground.png"); do
              cp icon.png "$f"
            done
          fi

          # بناء ملف الـ APK
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: ETEG-Waste-Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
